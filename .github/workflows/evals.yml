# Offline eval-tool checks. No secrets, no API keys, no private release access:
# the judge is a mocked in-process fake and golden external cases are never downloaded here.
# A trusted real-model quality-regression baseline is deliberately NOT run for pull requests
# (untrusted PR code must never see provider keys); run it manually from a trusted branch with
# `framefoundry scoreboard --baseline <main scoreboard.jsonl>`.
name: evals

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  eval-tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install FFmpeg (Mac)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Record runtime versions
        run: python --version && ffmpeg -version
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Offline eval tests (mocked judge only)
        env:
          ANTHROPIC_API_KEY: ''
          OPENAI_API_KEY: ''
        run: python -m pytest tests -q
