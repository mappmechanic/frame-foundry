[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framefoundry"
version = "0.1.0"
description = "Deterministic footage-to-clip pipeline with bounded editing judgment"
requires-python = ">=3.10,<3.14"
dependencies = ["jsonschema==4.25.1", "Pillow==11.3.0", "opentimelineio==0.18.1"]

[project.scripts]
framefoundry = "pipelines.ffmpeg.cli:main"

[tool.setuptools.packages.find]
include = ["pipelines*"]
